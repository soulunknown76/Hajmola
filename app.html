<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditMyDish - Futuristic Recipe Lab</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="container glass-nav"
        style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div class="brand">
            <h1>EditMyDish <span style="font-size: 0.6em; vertical-align: middle;">🍲</span></h1>
            <p style="color: rgba(255,255,255,0.7); letter-spacing: 1px; margin: 0; font-size: 0.8rem;">OPTIMIZE YOUR
                CULINARY DATA</p>
        </div>
        <div class="nav-links" style="display: flex; align-items: center; gap: 15px;">
            <span id="userDisplay" style="font-size: 0.9rem; color: var(--primary-color);"></span>
            <button onclick="logout()" class="btn btn-sm btn-secondary">Logout</button>
        </div>
    </header>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userDisplay').textContent = `Agent: ${user.username}`;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>

    <div class="container" style="animation-delay: 0.2s;">
        <div class="form-group">
            <label for="recipeDropdown">SELECT RECIPE PROTOCOL:</label>
            <select id="recipeDropdown" onchange="loadSelectedRecipe()">
                <option value="">-- INITIATE RECIPE SEARCH --</option>
            </select>
        </div>
    </div>

    <div id="recipeDetails" class="container" style="display:none; animation-delay: 0.4s;">
        <h2 id="recipeTitle">Recipe Title</h2>

        <div class="table-container">
            <table id="ingredientTable">
                <thead>
                    <tr>
                        <th>Ingredient Data</th>
                        <th>Quanitity Input</th>
                        <th>Unit Metrics</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Row content will be injected by JS -->
                </tbody>
            </table>
        </div>

        <div style="text-align: right; margin-top: 20px;">
            <button class="btn btn-secondary" onclick="alert('Feature coming soon: Save to Profile')">Save to
                Profile</button>
            <button onclick="calculateScore()" class="btn" style="margin-left: 10px;">Calculate Deviation</button>
        </div>

        <p id="scoreResult"></p>
    </div>

    <script src="script.js"></script>

</body>

</html>
