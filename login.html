<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EditMyDish</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container auth-container">
        <h1>Welcome Back</h1>
        <p style="margin-bottom: 30px; color: var(--text-color); opacity: 0.8;">Access your futuristic kitchen</p>

        <form>
            <div class="form-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" placeholder="Enter your ID" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your Key">
            </div>

            <button type="submit" class="btn">Initiate Sequence</button>
        </form>

        <p id="message" style="margin-top: 15px; display: none;"></p>

        <p style="margin-top: 20px; font-size: 0.9rem;">
            New recruit? <a href="register.html">Register Here</a>
        </p>
        <p style="margin-top: 10px; font-size: 0.8rem;">
            <a href="index.html" style="color: rgba(255,255,255,0.5);">← Back to Home</a>
        </p>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'app.html';
                } else {
                    messageEl.style.color = '#ff0000';
                    messageEl.textContent = data.message;
                    messageEl.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                messageEl.style.color = '#ff0000';
                messageEl.textContent = 'Network error. Please try again.';
                messageEl.style.display = 'block';
            }
        });
    </script>

</body>

</html>
