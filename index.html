<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditMyDish - Welcome</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .hero-container {
            text-align: center;
            padding: 60px 20px;
        }

        .hero-title {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: fadeIn 1s ease-out;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            animation: fadeIn 1.2s ease-out;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            animation: slideUp 1.4s ease-out;
        }
    </style>
</head>

<body>

    <div class="container hero-container">
        <h1 class="hero-title">EditMyDish <span style="font-size: 0.6em; vertical-align: middle;">🍲</span></h1>
        <p class="hero-subtitle">The Future of Culinary Data Management</p>

        <div class="glass-card"
            style="padding: 40px; border-radius: 20px; background: rgba(255,255,255,0.02); display: inline-block;">
            <p style="margin-bottom: 30px; font-size: 1.1rem;">Join the network to access advanced recipe protocols.</p>

            <div class="action-buttons">
                <a href="login.html" class="btn">Login</a>
                <a href="register.html" class="btn btn-secondary">Register</a>
            </div>
        </div>
    </div>

</body>

</html>
