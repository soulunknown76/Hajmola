<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Hub - EditMyDish</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .community-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .mix-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .mix-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--primary-color);
        }

        .mix-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .author-name {
            color: var(--secondary-color);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .mix-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vote-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .vote-btn:hover {
            color: var(--primary-color);
        }

        .like-btn:hover {
            color: #ff3366;
        }
    </style>
</head>

<body>

    <header class="container glass-nav"
        style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div class="brand">
            <h1>Community Hub <span style="font-size: 0.6em; vertical-align: middle;">🌐</span></h1>
        </div>
        <div class="nav-links">
            <a href="app.html" class="btn btn-sm">Back to Lab</a>
        </div>
    </header>

    <div class="container">
        <h2>Global Mixture Feed</h2>
        <div id="communityGrid" class="community-grid">
            <p>Loading community transmissions...</p>
        </div>
    </div>

    <!-- Ingredients Modal -->
    <div id="ingredientsModal" class="modal" style="display: none;">
        <div class="modal-content glass-card">
            <span class="close-btn" onclick="closeIngredients()">&times;</span>
            <h2 id="modalRecipeTitle">Ingredients</h2>
            <div id="ingredientsList" class="ingredients-list">
                <!-- Ingredients will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('user'));

        async function loadCommunityFeed() {
            try {
                const response = await fetch('/api/community/feed');
                const feed = await response.json();

                const grid = document.getElementById('communityGrid');
                grid.innerHTML = '';

                feed.forEach(mix => {
                    // Serialize ingredients to pass to function
                    const ingredientsData = encodeURIComponent(JSON.stringify(mix.ingredients));

                    const card = document.createElement('div');
                    card.className = 'mix-card';
                    card.innerHTML = `
                        <div class="mix-header">
                            <span class="author-name">AGENT: ${mix.author}</span>
                            <span style="font-size: 0.8rem; opacity: 0.7;">${new Date(mix.date).toLocaleDateString()}</span>
                        </div>
                        <h3 style="font-size: 1.2rem; margin-bottom: 10px;">${mix.recipeTitle}</h3>
                        <p style="margin-bottom: 10px;">Deviation: <span style="color: ${getDeviationColor(mix.deviationScore)}">${mix.deviationScore.toFixed(2)}%</span></p>
                        <p style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 15px;">
                            ${mix.status}
                        </p>
                        
                        <button class="view-btn" onclick="showIngredients('${mix.recipeTitle}', '${ingredientsData}')">
                            View Ingredients
                        </button>

                        <div class="mix-stats">
                            <button class="vote-btn like-btn" onclick="vote('${mix._id}', 'like')">
                                ❤️ ${mix.likes}
                            </button>
                            <button class="vote-btn" onclick="vote('${mix._id}', 'dislike')">
                                💔 ${mix.dislikes}
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading feed:', error);
            }
        }

        function getDeviationColor(score) {
            if (score < 15) return '#00ff00';
            if (score < 40) return '#ffaa00';
            return '#ff0000';
        }

        async function vote(id, type) {
            if (!currentUser) return alert("Please login to vote.");

            try {
                const response = await fetch('/api/community/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, type, userEmail: currentUser.email })
                });

                const data = await response.json();
                if (response.ok) {
                    loadCommunityFeed(); // Reload to show updated counts
                } else {
                    alert(data.message); // Show error message (e.g. "Already voted")
                }
            } catch (error) {
                console.error('Vote failed:', error);
            }
        }

        function showIngredients(title, encodedIngredients) {
            const ingredients = JSON.parse(decodeURIComponent(encodedIngredients));
            document.getElementById('modalRecipeTitle').textContent = `Mix: ${title}`;
            const list = document.getElementById('ingredientsList');
            list.innerHTML = '';

            ingredients.forEach(ing => {
                const item = document.createElement('div');
                item.className = 'ingredient-item';
                item.innerHTML = `
                    <span>${ing.name}</span>
                    <span style="color: var(--primary-color);">${ing.quantity} ${ing.unit}</span>
                `;
                list.appendChild(item);
            });

            document.getElementById('ingredientsModal').style.display = 'flex';
        }

        function closeIngredients() {
            document.getElementById('ingredientsModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const modal = document.getElementById("ingredientsModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        loadCommunityFeed();
    </script>

</body>

</html>
